<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>LearnMate UI Preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f1f3f7;font-family:Inter,Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.panel{width:390px;min-height:650px;background:#0b0f18;color:#eee;border-radius:16px;padding:14px;box-shadow:0 20px 70px #0006}
.brand{font-weight:700;font-size:15px;border-bottom:1px solid #293144;padding:3px 2px 14px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7449ff,#c66cff);margin-right:8px;vertical-align:middle}
.brand small{display:block;color:#7e8798;font-size:8px;margin:2px 0 0 42px;font-weight:400}
.hint{margin-top:16px;border:1px dashed #343d50;border-radius:10px;padding:13px;color:#8f98a8;font-size:10px;line-height:1.6}
.hint b{color:#c58cff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.actions button{padding:11px 5px;background:#121827;color:#dce0e8;border:1px solid #303749;border-radius:8px;font-size:9px}
.actions .full{grid-column:1/3}
.result{background:#111724;border:1px solid #293144;border-radius:10px;padding:11px;margin-top:12px}
.label{font-size:8px;color:#778196;font-weight:800;letter-spacing:.08em}
.rh{display:flex;justify-content:space-between}
.rh button{background:none;border:0;color:#8d96a7;font-size:8px;margin-left:8px}
.result p{font-size:10px;line-height:1.65;white-space:pre-line;color:#d7dbe3}
.custom{margin-top:12px}
.custom button{width:100%;margin-top:6px;padding:10px;text-align:left;background:#121827;color:#dce0e8;border:1px solid #303749;border-radius:8px;font-size:9px}
</style>
</head>
<body>
<div class="panel">
  <div class="brand">
    <span class="logo">LM</span>LearnMate
    <small>Powered by Grok 4.6</small>
  </div>

  <div class="hint">
    Select text on any webpage. A small <b>✨ Use LearnMate</b> button will appear beside your selection.
  </div>

  <div class="actions">
    <button>✨ Summarize</button>
    <button>🧠 Explain Simply</button>
    <button>✍️ Fix Grammar</button>
    <button>📚 Learn Deeper</button>
    <button>💡 Give Example</button>
    <button>🎯 Interview Mode</button>
    <button class="full">🔄 Rewrite Clearly</button>
  </div>

  <div class="custom">
    <div class="label">YOUR SAVED PROMPTS</div>
    <button>⚡ DSA Coach</button>
    <button>⚡ Java Interviewer</button>
  </div>

  <div class="result">
    <div class="rh"><div class="label">RESULT</div><div><button id="copy">Copy</button><button id="listen">Listen</button></div></div>
    <p>Choose an action above.

Your selected text will appear only in the actual LearnMate side panel after you select text on a webpage.</p>
  </div>
</div>
</body>
</html>
